name: terraform-ci

# Runs quality gates on every PR that touches Terraform code: gitleaks, fmt,
# validate, tflint, terraform-docs, trivy/checkov (security/compliance),
# terraform test, conftest, infracost (cost diff), and a plan posted as a PR
# comment. Nothing here applies changes.
#
# NOTE (scaffolding): hardcoded to live/example-dev for now, the only real
# stack that exists. When more live/<project> stacks are added, turn the
# "terraform" job into a matrix over `live/*` directories that changed.

on:
  pull_request:
    paths:
      - "modules/**"
      - "scenarios/**"
      - "live/**"
      - "policy/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  id-token: write   # required for AWS OIDC
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: live/example-dev
  AWS_REGION: ap-northeast-2

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks needs history, not just the merge commit

      # Runs first and blocking: this was previously pre-commit-only, meaning
      # a contributor who skips pre-commit (or never installed it) could push
      # a secret straight to a PR with nothing in CI to catch it.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: terraform fmt check
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4

      - name: TFLint
        run: |
          tflint --init --config="$(pwd)/.tflint.hcl"
          tflint --config="$(pwd)/.tflint.hcl" --recursive

      - name: terraform-docs check
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1
        with:
          config-file: .terraform-docs.yml
          working-dir: modules/*,scenarios/*,bootstrap,live/example-dev
          output-check: true
          fail-on-diff: true

      # Non-blocking (continue-on-error): this repo's modules are
      # intentionally minimal (see each module's "Not yet included" section),
      # so both scanners have real, expected findings today. They still
      # report in the PR for visibility — see .trivy.yaml / .checkov.yaml for
      # the reasoning, and flip to blocking per-project once a scenario
      # graduates from scaffold to a real workload.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: .
          trivy-config: .trivy.yaml
          exit-code: "1"

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@5659ddea96102e16d8f221b3d8402453c0b1c150 # v12.3121.0 (was `master`, same commit at pin time -- see commit message)
        continue-on-error: true
        with:
          config_file: .checkov.yaml

      # terraform test uses mock_provider (Terraform >= 1.7) — runs offline,
      # no AWS credentials or real plan needed. Only modules with a tests/
      # dir have coverage so far (see modules/*/tests/); this loop just
      # skips the rest.
      - name: terraform test
        run: |
          set -e
          for dir in modules/*/; do
            if [ -d "${dir}tests" ]; then
              echo "=== terraform test: $dir ==="
              (cd "$dir" && terraform init -backend=false -input=false && terraform test)
            fi
          done

      - name: terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -out=tfplan.binary | tee plan_output.txt

      - name: terraform show (JSON for Conftest)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -json tfplan.binary > plan.json

      - name: Conftest policy check
        uses: instrumenta/conftest-action@ae9212d5c0c26e21eedf359e2889d0d5d39dabd4 # master @ 2026-08-29, same commit at pin time (no tag newer than v0.4.0) -- see commit message
        with:
          files: ${{ env.TF_WORKING_DIR }}/plan.json
          policy: policy

      - name: Comment plan on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan (\`${{ env.TF_WORKING_DIR }}\`)\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });

      - name: Infracost diff
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost diff and comment
        run: |
          infracost diff --path=${{ env.TF_WORKING_DIR }} \
            --format=json --out-file=/tmp/infracost.json
          infracost comment github --path=/tmp/infracost.json \
            --repo=$GITHUB_REPOSITORY \
            --github-token=${{ secrets.GITHUB_TOKEN }} \
            --pull-request=${{ github.event.pull_request.number }} \
            --behavior=update
