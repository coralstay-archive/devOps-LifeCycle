name: drift-detect

# Scheduled drift detection: driftctl (the obvious open-source tool for this)
# is unmaintained, so this repo uses the practical current alternative —
# a cron'd `terraform plan -detailed-exitcode` against each live/<project>
# stack. Exit code 2 means the real infra no longer matches the Terraform
# config (drift); this opens/updates a tracking issue instead of silently
# doing nothing, since nobody is watching this workflow's run list day to day.
#
# NOTE (scaffolding): hardcoded to live/example-dev, same caveat as the other
# workflows — matrix this over live/* once more stacks exist.

on:
  schedule:
    - cron: "0 22 * * *" # 07:00 KST daily
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TF_WORKING_DIR: live/example-dev
  AWS_REGION: ap-northeast-2

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: terraform plan (detect drift)
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan.binary | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8').slice(0, 60000);
            const title = `Drift detected in ${{ env.TF_WORKING_DIR }}`;
            const body = `Scheduled \`terraform plan\` found a difference between real infrastructure and Terraform config.\n\n<details><summary>Plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "drift",
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["drift"],
              });
            }

      - name: Fail the job if drift was found
        if: steps.plan.outputs.exitcode == '2'
        run: exit 1
